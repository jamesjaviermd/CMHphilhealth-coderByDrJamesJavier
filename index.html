<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PhilHealth ICD-10 & RVS Lookup Tool</title>
  <style>
    :root {
      --primary: #006699;
      --accent: #2e7d32;
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #333333;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
    }
    header {
      background: var(--primary);
      color: white;
      padding: 15px 20px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    header h1 {
      margin: 0;
      font-size: 1.5rem;
    }
    header p {
      margin: 5px 0 0 0;
      font-size: 0.9rem;
      opacity: 0.9;
    }
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }
    .tab-btn {
      flex: 1;
      padding: 12px;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      background: #e0e0e0;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: var(--primary);
      color: white;
    }
    .search-box {
      width: 100%;
      padding: 12px 15px;
      font-size: 1rem;
      border: 2px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      margin-bottom: 15px;
    }
    .search-box:focus {
      outline: none;
      border-color: var(--primary);
    }
    .status-bar {
      font-size: 0.85rem;
      color: #666;
      margin-bottom: 10px;
    }
    .table-container {
      background: var(--card);
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }
    th, td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid #eee;
    }
    th {
      background-color: #f0f4f8;
      font-weight: 600;
      color: #444;
      position: sticky;
      top: 0;
    }
    tr:hover {
      background-color: #f9fbfd;
    }
    .badge {
      display: inline-block;
      padding: 2px 6px;
      font-size: 0.75rem;
      font-weight: bold;
      border-radius: 4px;
    }
    .badge-yes { background: #e8f5e9; color: #2e7d32; }
    .badge-no { background: #ffebee; color: #c62828; }
    .badge-sex { background: #e3f2fd; color: #1565c0; }
    .badge-rvs { 
      background: #fff3e0; 
      color: #e65100; 
      border: 1px solid #ffe0b2;
      margin: 2px 4px 2px 0;
      cursor: pointer;
    }
    .no-results {
      text-align: center;
      padding: 30px;
      color: #777;
      font-style: italic;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Cainta Municipal Hospital - PhilHealth Coding Lookup</h1>
    <p>Search official PHL-DRG ICD-10 Diagnoses and RVS Surgical/Medical Procedures</p>
  </header>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('icd10')">ICD-10 Diagnoses</button>
    <button class="tab-btn" onclick="switchTab('rvs')">RVS Procedures</button>
  </div>

  <input type="text" id="searchInput" class="search-box" placeholder="Type to search by code or keyword (e.g., Dengue, Appendicitis, 44950)..." oninput="handleSearch()">

  <div id="statusBar" class="status-bar">Loading databases...</div>

  <div class="table-container">
    <table id="dataTable">
      <thead id="tableHead"></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<script>
  let icdData = [];
  let rvsData = [];
  let currentMode = 'icd10'; // 'icd10' or 'rvs'

  // Fetch JSON files on initialization
  Promise.all([
    fetch('icd10_codes.json').then(res => res.json()),
    fetch('rvs_codes.json').then(res => res.json())
  ]).then(([icd, rvs]) => {
    icdData = icd;
    rvsData = rvs;
    document.getElementById('statusBar').innerText = `Loaded ${icdData.length.toLocaleString()} ICD-10 codes and ${rvsData.length.toLocaleString()} RVS codes.`;
    renderTable();
  }).catch(err => {
    document.getElementById('statusBar').innerText = "Error loading database JSON files. Make sure local web server is running.";
    console.error(err);
  });

  function switchTab(mode, initialQuery = '') {
    currentMode = mode;
    document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
      btn.classList.toggle('active', (mode === 'icd10' && idx === 0) || (mode === 'rvs' && idx === 1));
    });
    document.getElementById('searchInput').value = initialQuery;
    renderTable();
  }

  function handleSearch() {
    renderTable();
  }

  // Calculate edit distance between strings for typo tolerance
  function levenshteinDistance(a, b) {
    if (a.length === 0) return b.length;
    if (b.length === 0) return a.length;
    const matrix = Array.from({ length: a.length + 1 }, () => []);
    for (let i = 0; i <= a.length; i++) matrix[i][0] = i;
    for (let j = 0; j <= b.length; j++) matrix[0][j] = j;

    for (let i = 1; i <= a.length; i++) {
      for (let j = 1; j <= b.length; j++) {
        const cost = a[i - 1] === b[j - 1] ? 0 : 1;
        matrix[i][j] = Math.min(
          matrix[i - 1][j] + 1,       // deletion
          matrix[i][j - 1] + 1,       // insertion
          matrix[i - 1][j - 1] + cost // substitution
        );
      }
    }
    return matrix[a.length][b.length];
  }

  // Check if target text contains any word close to search token
  function fuzzyMatchWord(targetText, searchToken) {
    if (searchToken.length < 3) return false;
    const words = targetText.toLowerCase().split(/\W+/);
    const maxAllowedDistance = searchToken.length > 6 ? 2 : 1;

    return words.some(word => levenshteinDistance(word, searchToken) <= maxAllowedDistance);
  }

  // Option 1 Direct Property Extraction
  function getRelatedRVSHTML(item) {
    const rawRvs = item.rvs || item.rvs_code || item.rvs_codes;
    
    if (rawRvs) {
      const rvsList = Array.isArray(rawRvs) ? rawRvs : String(rawRvs).split(',').map(s => s.trim());
      
      if (rvsList.length > 0) {
        return rvsList.map(code => 
          `<span class="badge badge-rvs" title="Click to lookup RVS ${code}" onclick="switchTab('rvs', '${code}')">${code}</span>`
        ).join(' ');
      }
    }

    return '<span style="color: #999; font-size: 0.8rem;">None</span>';
  }

  function renderTable() {
    const query = document.getElementById('searchInput').value.toLowerCase().trim();
    const thead = document.getElementById('tableHead');
    const tbody = document.getElementById('tableBody');

    tbody.innerHTML = '';
    const queryTokens = query.split(/\s+/).filter(Boolean);

    if (currentMode === 'icd10') {
      thead.innerHTML = `
        <tr>
          <th style="width: 12%;">ICD-10 Code</th>
          <th style="width: 42%;">Diagnosis Description</th>
          <th style="width: 18%;">Related RVS Code(s)</th>
          <th style="width: 12%;">Acceptable PDx</th>
          <th style="width: 8%;">Sex</th>
          <th style="width: 8%;">MDC</th>
        </tr>
      `;

      const filtered = icdData.filter(item => {
        if (queryTokens.length === 0) return true;
        const code = String(item.code || '').toLowerCase();
        const desc = String(item.description || '').toLowerCase();
        const combined = `${code} ${desc}`;

        return queryTokens.every(token => 
          combined.includes(token) || fuzzyMatchWord(desc, token)
        );
      }).slice(0, 100);

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="no-results">No matching ICD-10 diagnoses found.</td></tr>`;
        return;
      }

      filtered.forEach(item => {
        const pdxClass = item.pdx_acceptable === 'Yes' ? 'badge-yes' : 'badge-no';
        const rvsHTML = getRelatedRVSHTML(item);

        tbody.innerHTML += `
          <tr>
            <td><strong>${item.code || '-'}</strong></td>
            <td>${item.description || '-'}</td>
            <td>${rvsHTML}</td>
            <td><span class="badge ${pdxClass}">${item.pdx_acceptable || 'N/A'}</span></td>
            <td><span class="badge badge-sex">${item.sex || 'Both'}</span></td>
            <td>${item.mdc || '-'}</td>
          </tr>
        `;
      });

    } else {
      thead.innerHTML = `
        <tr>
          <th style="width: 15%;">RVS Code</th>
          <th style="width: 70%;">Procedure Description</th>
          <th style="width: 15%;">Valid Sex</th>
        </tr>
      `;

      const filtered = rvsData.filter(item => {
        if (queryTokens.length === 0) return true;
        const code = String(item.code || '').toLowerCase();
        const desc = String(item.description || '').toLowerCase();
        const combined = `${code} ${desc}`;

        return queryTokens.every(token => 
          combined.includes(token) || fuzzyMatchWord(desc, token)
        );
      }).slice(0, 100);

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="3" class="no-results">No matching RVS procedures found.</td></tr>`;
        return;
      }

      filtered.forEach(item => {
        tbody.innerHTML += `
          <tr>
            <td><strong>${item.code || '-'}</strong></td>
            <td>${item.description || '-'}</td>
            <td><span class="badge badge-sex">${item.sex || 'Both'}</span></td>
          </tr>
        `;
      });
    }
  }
</script>

</body>
</html>
