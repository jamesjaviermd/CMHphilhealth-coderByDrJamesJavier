<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PhilHealth ICD-10 & RVS Lookup Tool</title>
  <style>
    :root {
      --primary: #006699;
      --accent: #2e7d32;
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #333333;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
    }
    header {
      background: var(--primary);
      color: white;
      padding: 15px 20px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    header h1 {
      margin: 0;
      font-size: 1.5rem;
    }
    header p {
      margin: 5px 0 0 0;
      font-size: 0.9rem;
      opacity: 0.9;
    }
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }
    .tab-btn {
      flex: 1;
      padding: 12px;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      background: #e0e0e0;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: var(--primary);
      color: white;
    }
    .search-box {
      width: 100%;
      padding: 12px 15px;
      font-size: 1rem;
      border: 2px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      margin-bottom: 15px;
    }
    .search-box:focus {
      outline: none;
      border-color: var(--primary);
    }
    .status-bar {
      font-size: 0.85rem;
      color: #666;
      margin-bottom: 10px;
    }
    .table-container {
      background: var(--card);
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }
    th, td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid #eee;
    }
    th {
      background-color: #f0f4f8;
      font-weight: 600;
      color: #444;
      position: sticky;
      top: 0;
    }
    tr:hover {
      background-color: #f9fbfd;
    }
    .badge {
      display: inline-block;
      padding: 2px 6px;
      font-size: 0.75rem;
      font-weight: bold;
      border-radius: 4px;
    }
    .badge-yes { background: #e8f5e9; color: #2e7d32; }
    .badge-no { background: #ffebee; color: #c62828; }
    .badge-sex { background: #e3f2fd; color: #1565c0; }
    .badge-rvs { 
      background: #fff3e0; 
      color: #e65100; 
      border: 1px solid #ffe0b2;
      margin: 2px 4px 2px 0;
      cursor: pointer;
    }
    .no-results {
      text-align: center;
      padding: 30px;
      color: #777;
      font-style: italic;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Cainta Municipal Hospital - PhilHealth Coding Lookup</h1>
    <p>Search official PHL-DRG ICD-10 Diagnoses and RVS Surgical/Medical Procedures</p>
  </header>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('icd10')">ICD-10 Diagnoses</button>
    <button class="tab-btn" onclick="switchTab('rvs')">RVS Procedures</button>
  </div>

  <input type="text" id="searchInput" class="search-box" placeholder="Type to search by code or keyword (e.g., Dengue, Appendicitis, 44950)..." oninput="handleSearch()">

  <div id="statusBar" class="status-bar">Loading databases...</div>

  <div class="table-container">
    <table id="dataTable">
      <thead id="tableHead"></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<script>
  let icdData = [];
  let rvsData = [];
  let currentMode = 'icd10'; // 'icd10' or 'rvs'

  // Corrected PhilHealth RVS Code Correlation Mapping Table
  const clinicalCorrelationMap = {
    "K35": ["44950", "44960"],          // Acute Appendicitis -> Appendectomy (44950), with ruptured appendicitis/peritonitis (44960)
    "K37": ["44950", "44960"],          // Unspecified Appendicitis -> Appendectomy
    "K80": ["47562", "47600"],          // Cholelithiasis -> Laparoscopic Cholecystectomy (47562), Open (47600)
    "K81": ["47562", "47600"],          // Cholecystitis -> Laparoscopic / Open Cholecystectomy
    "K40": ["49505", "49507"],          // Inguinal Hernia -> Inguinal Hernioplasty/Herniorrhaphy
    "K41": ["49520", "49525"],          // Femoral Hernia -> Hernioplasty
    "K42": ["49580", "49585"],          // Umbilical Hernia -> Repair
    "K85": ["48150", "48540"],          // Acute Pancreatitis
    "H25": ["66984", "66982"],          // Cataract -> Extracapsular Cataract Removal / Phacoemulsification
    "H26": ["66984"],
    "O80": ["59400", "59409", "59410"], // Vaginal Delivery
    "O82": ["59510", "59514", "59515"], // Cesarean Section
    "S82": ["27750", "27752", "27758"], // Tibia Fracture -> Closed/Open Treatment / ORIF
    "S72": ["27230", "27236", "27244"], // Femur Fracture -> Open/Closed Fixation / Bipolar Arthroplasty
    "S52": ["25500", "25515", "25565"], // Radius/Ulna Fracture -> ORIF
    "J35.1": ["42820", "42821"],        // Hypertrophy of tonsils -> Tonsillectomy
    "J35.2": ["42830", "42831"],        // Hypertrophy of adenoids -> Adenoidectomy
    "N40": ["52601", "55801"],          // BPH -> TURP / Prostatectomy
    "E04": ["60220", "60240"]           // Goiter -> Thyroidectomy
  };

  // Clinical Synonym Dictionary for Cross-Query Matching
  const clinicalSynonyms = {
    "appendicitis": ["appendectomy", "44950", "44960"],
    "cholecystitis": ["cholecystectomy", "gallbladder", "47562", "47600"],
    "gallstone": ["cholecystectomy", "47562"],
    "cataract": ["phacoemulsification", "extracapsular", "66984"],
    "hernia": ["herniorrhaphy", "hernioplasty", "49505"],
    "fracture": ["orif", "closed reduction", "fixation"],
    "goiter": ["thyroidectomy", "60220"],
    "tonsillitis": ["tonsillectomy", "42820"]
  };

  // Fetch JSON files on initialization
  Promise.all([
    fetch('icd10_codes.json').then(res => res.json()),
    fetch('rvs_codes.json').then(res => res.json())
  ]).then(([icd, rvs]) => {
    icdData = icd;
    rvsData = rvs;
    document.getElementById('statusBar').innerText = `Loaded ${icdData.length.toLocaleString()} ICD-10 codes and ${rvsData.length.toLocaleString()} RVS codes.`;
    renderTable();
  }).catch(err => {
    document.getElementById('statusBar').innerText = "Error loading database JSON files. Make sure local web server is running.";
    console.error(err);
  });

  function switchTab(mode, initialQuery = '') {
    currentMode = mode;
    document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
      btn.classList.toggle('active', (mode === 'icd10' && idx === 0) || (mode === 'rvs' && idx === 1));
    });
    document.getElementById('searchInput').value = initialQuery;
    renderTable();
  }

  function handleSearch() {
    renderTable();
  }

  // Calculate edit distance between strings for typo tolerance
  function levenshteinDistance(a, b) {
    if (a.length === 0) return b.length;
    if (b.length === 0) return a.length;
    const matrix = Array.from({ length: a.length + 1 }, () => []);
    for (let i = 0; i <= a.length; i++) matrix[i][0] = i;
    for (let j = 0; j <= b.length; j++) matrix[0][j] = j;

    for (let i = 1; i <= a.length; i++) {
      for (let j = 1; j <= b.length; j++) {
        const cost = a[i - 1] === b[j - 1] ? 0 : 1;
        matrix[i][j] = Math.min(
          matrix[i - 1][j] + 1,       // deletion
          matrix[i][j - 1] + 1,       // insertion
          matrix[i - 1][j - 1] + cost // substitution
        );
      }
    }
    return matrix[a.length][b.length];
  }

  // Check if target text contains any word close to search token
  function fuzzyMatchWord(targetText, searchToken) {
    if (searchToken.length < 3) return false;
    const words = targetText.toLowerCase().split(/\W+/);
    const maxAllowedDistance = searchToken.length > 6 ? 2 : 1;

    return words.some(word => levenshteinDistance(word, searchToken) <= maxAllowedDistance);
  }

  // Expand query tokens using clinical synonym dictionary
  function getExpandedTokens(tokens) {
    let expanded = [...tokens];
    tokens.forEach(tok => {
      const syns = clinicalSynonyms[tok.toLowerCase()];
      if (syns) {
        expanded.push(...syns);
      }
    });
    return expanded;
  }

  // Helper to retrieve associated RVS codes for an ICD-10 record using clinical correlation
  function getRelatedRVSHTML(item) {
    let matchedRVS = [];

    // Priority 1: Direct JSON property (item.rvs, item.rvs_code, or item.rvs_codes)
    if (item.rvs || item.rvs_code || item.rvs_codes) {
      const rawRvs = item.rvs || item.rvs_code || item.rvs_codes;
      matchedRVS = Array.isArray(rawRvs) ? rawRvs : String(rawRvs).split(',').map(s => s.trim());
    }

    // Priority 2: Clinical Correlation Map lookup (exact code or category prefix matching)
    if (matchedRVS.length === 0 && item.code) {
      const cleanCode = String(item.code).trim().toUpperCase();
      const prefix3 = cleanCode.substring(0, 3);
      
      if (clinicalCorrelationMap[cleanCode]) {
        matchedRVS = clinicalCorrelationMap[cleanCode];
      } else if (clinicalCorrelationMap[prefix3]) {
        matchedRVS = clinicalCorrelationMap[prefix3];
      }
    }

    // Render badges if codes were correlated
    if (matchedRVS.length > 0) {
      return matchedRVS.map(code => 
        `<span class="badge badge-rvs" title="Click to lookup RVS ${code}" onclick="switchTab('rvs', '${code}')">${code}</span>`
      ).join(' ');
    }

    return '<span style="color: #999; font-size: 0.8rem;">None</span>';
  }

  function renderTable() {
    const query = document.getElementById('searchInput').value.toLowerCase().trim();
    const thead = document.getElementById('tableHead');
    const tbody = document.getElementById('tableBody');

    tbody.innerHTML = '';
    const rawTokens = query.split(/\s+/).filter(Boolean);
    const queryTokens = getExpandedTokens(rawTokens);

    if (currentMode === 'icd10') {
      thead.innerHTML = `
        <tr>
          <th style="width: 12%;">ICD-10 Code</th>
          <th style="width: 42%;">Diagnosis Description</th>
          <th style="width: 18%;">Related RVS Code(s)</th>
          <th style="width: 12%;">Acceptable PDx</th>
          <th style="width: 8%;">Sex</th>
          <th style="width: 8%;">MDC</th>
        </tr>
      `;

      const filtered = icdData.filter(item => {
        if (rawTokens.length === 0) return true;
        const code = String(item.code || '').toLowerCase();
        const desc = String(item.description || '').toLowerCase();
        const combined = `${code} ${desc}`;

        return queryTokens.some(token => 
          combined.includes(token) || fuzzyMatchWord(desc, token)
        );
      }).slice(0, 100);

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="no-results">No matching ICD-10 diagnoses found.</td></tr>`;
        return;
      }

      filtered.forEach(item => {
        const pdxClass = item.pdx_acceptable === 'Yes' ? 'badge-yes' : 'badge-no';
        const rvsHTML = getRelatedRVSHTML(item);

        tbody.innerHTML += `
          <tr>
            <td><strong>${item.code || '-'}</strong></td>
            <td>${item.description || '-'}</td>
            <td>${rvsHTML}</td>
            <td><span class="badge ${pdxClass}">${item.pdx_acceptable || 'N/A'}</span></td>
            <td><span class="badge badge-sex">${item.sex || 'Both'}</span></td>
            <td>${item.mdc || '-'}</td>
          </tr>
        `;
      });

    } else {
      thead.innerHTML = `
        <tr>
          <th style="width: 15%;">RVS Code</th>
          <th style="width: 70%;">Procedure Description</th>
          <th style="width: 15%;">Valid Sex</th>
        </tr>
      `;

      const filtered = rvsData.filter(item => {
        if (rawTokens.length === 0) return true;
        const code = String(item.code || '').toLowerCase();
        const desc = String(item.description || '').toLowerCase();
        const combined = `${code} ${desc}`;

        return queryTokens.some(token => 
          combined.includes(token) || fuzzyMatchWord(desc, token)
        );
      }).slice(0, 100);

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="3" class="no-results">No matching RVS procedures found.</td></tr>`;
        return;
      }

      filtered.forEach(item => {
        tbody.innerHTML += `
          <tr>
            <td><strong>${item.code || '-'}</strong></td>
            <td>${item.description || '-'}</td>
            <td><span class="badge badge-sex">${item.sex || 'Both'}</span></td>
          </tr>
        `;
      });
    }
  }
</script>

</body>
</html>
