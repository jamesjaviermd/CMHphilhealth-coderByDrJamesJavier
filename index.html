<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PhilHealth ICD-10 & RVS Lookup Tool</title>
  <style>
    :root {
      --primary: #006699;
      --accent: #2e7d32;
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #333333;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
    }
    header {
      background: var(--primary);
      color: white;
      padding: 15px 20px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    header h1 {
      margin: 0;
      font-size: 1.5rem;
    }
    header p {
      margin: 5px 0 0 0;
      font-size: 0.9rem;
      opacity: 0.9;
    }
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }
    .tab-btn {
      flex: 1;
      padding: 12px;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      background: #e0e0e0;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: var(--primary);
      color: white;
    }
    .search-box {
      width: 100%;
      padding: 12px 15px;
      font-size: 1rem;
      border: 2px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      margin-bottom: 15px;
    }
    .search-box:focus {
      outline: none;
      border-color: var(--primary);
    }
    .status-bar {
      font-size: 0.85rem;
      color: #666;
      margin-bottom: 10px;
    }
    .table-container {
      background: var(--card);
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }
    th, td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid #eee;
    }
    th {
      background-color: #f0f4f8;
      font-weight: 600;
      color: #444;
      position: sticky;
      top: 0;
    }
    tr:hover {
      background-color: #f9fbfd;
    }
    .badge {
      display: inline-block;
      padding: 2px 6px;
      font-size: 0.75rem;
      font-weight: bold;
      border-radius: 4px;
    }
    .badge-yes { background: #e8f5e9; color: #2e7d32; }
    .badge-no { background: #ffebee; color: #c62828; }
    .badge-sex { background: #e3f2fd; color: #1565c0; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Cainta Municipal Hospital - PhilHealth Coding Lookup</h1>
    <p>Search official PHL-DRG ICD-10 Diagnoses and RVS Surgical/Medical Procedures</p>
  </header>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('icd10')">ICD-10 Diagnoses</button>
    <button class="tab-btn" onclick="switchTab('rvs')">RVS Procedures</button>
  </div>

  <input type="text" id="searchInput" class="search-box" placeholder="Type to search by code or keyword (e.g., Dengue, Appendicitis, 47600)..." oninput="handleSearch()">

  <div id="statusBar" class="status-bar">Loading databases...</div>

  <div class="table-container">
    <table id="dataTable">
      <thead id="tableHead"></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<script>
  let icdData = [];
  let rvsData = [];
  let currentMode = 'icd10'; // 'icd10' or 'rvs'

  // Fetch JSON files on initialization
  Promise.all([
    fetch('icd10_codes.json').then(res => res.json()),
    fetch('rvs_codes.json').then(res => res.json())
  ]).then(([icd, rvs]) => {
    icdData = icd;
    rvsData = rvs;
    document.getElementById('statusBar').innerText = `Loaded ${icdData.length.toLocaleString()} ICD-10 codes and ${rvsData.length.toLocaleString()} RVS codes.`;
    renderTable();
  }).catch(err => {
    document.getElementById('statusBar').innerText = "Error loading database JSON files. Make sure local web server is running.";
    console.error(err);
  });

  function switchTab(mode) {
    currentMode = mode;
    document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
      btn.classList.toggle('active', (mode === 'icd10' && idx === 0) || (mode === 'rvs' && idx === 1));
    });
    document.getElementById('searchInput').value = '';
    renderTable();
  }

  function handleSearch() {
    renderTable();
  }

  function renderTable() {
    const query = document.getElementById('searchInput').value.toLowerCase().trim();
    const thead = document.getElementById('tableHead');
    const tbody = document.getElementById('tableBody');

    tbody.innerHTML = '';

    if (currentMode === 'icd10') {
      thead.innerHTML = `
        <tr>
          <th style="width: 15%;">ICD-10 Code</th>
          <th style="width: 50%;">Diagnosis Description</th>
          <th style="width: 15%;">Acceptable PDx</th>
          <th style="width: 10%;">Sex</th>
          <th style="width: 10%;">MDC Category</th>
        </tr>
      `;

      const filtered = icdData.filter(item => 
        String(item.code || '').toLowerCase().includes(query) || 
        String(item.description || '').toLowerCase().includes(query)
      ).slice(0, 100); // Limit to top 100 results for speed

      filtered.forEach(item => {
        const pdxClass = item.pdx_acceptable === 'Yes' ? 'badge-yes' : 'badge-no';
        tbody.innerHTML += `
          <tr>
            <td><strong>${item.code}</strong></td>
            <td>${item.description}</td>
            <td><span class="badge ${pdxClass}">${item.pdx_acceptable}</span></td>
            <td><span class="badge badge-sex">${item.sex}</span></td>
            <td>${item.mdc || '-'}</td>
          </tr>
        `;
      });

    } else {
      thead.innerHTML = `
        <tr>
          <th style="width: 15%;">RVS Code</th>
          <th style="width: 70%;">Procedure Description</th>
          <th style="width: 15%;">Valid Sex</th>
        </tr>
      `;

      const filtered = rvsData.filter(item => 
        String(item.code || '').toLowerCase().includes(query) || 
        String(item.description || '').toLowerCase().includes(query)
      ).slice(0, 100);

      filtered.forEach(item => {
        tbody.innerHTML += `
          <tr>
            <td><strong>${item.code}</strong></td>
            <td>${item.description}</td>
            <td><span class="badge badge-sex">${item.sex}</span></td>
          </tr>
        `;
      });
    }
  }
</script>

</body>
</html>
